name: Build and Push MCPHub HF Container

on:
  push:
    branches:
      - main
      - feature/huggingface-docker-optimization
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-hf

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Required for pushing to ghcr.io
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=hf-spaces,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=MCPHub (Hugging Face Spaces)
          org.opencontainers.image.description=The Unified Hub for Model Context Protocol (MCP) Servers - Optimized for Hugging Face Spaces
          org.opencontainers.image.vendor=MCPHub Team
          org.opencontainers.image.licenses=Apache-2.0

    - name: 🔑 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🧪 Test Docker build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.hf
        platforms: linux/amd64
        push: false
        tags: test-image
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🏗️ Build and push container image
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.hf
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ github.sha }}

    - name: 📋 Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      if: github.event_name != 'pull_request'
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build-and-push.outputs.digest }}
        push-to-registry: true

    - name: 🔍 Inspect image
      if: success()
      run: |
        echo "🎉 Image built and pushed successfully!"
        echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "🏷️ Tags: ${{ steps.meta.outputs.tags }}"
        echo "🆔 Digest: ${{ steps.build-and-push.outputs.digest }}"
        echo ""
        echo "🚀 Usage Instructions:"
        echo "Docker: docker run -p 7860:7860 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Compose: Use 'image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest' in docker-compose.yml"
        echo ""
        echo "🔗 Package URL: https://github.com/${{ github.repository }}/pkgs/container/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-hf"

    - name: 🧹 Clean up Docker cache
      if: always()
      run: |
        docker system prune -f
        docker buildx prune -f